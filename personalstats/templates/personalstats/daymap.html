{% extends 'base.html' %}
{% load i18n %}
{% load l10n %}
{% load static %}

{% block title %}{% trans 'Day map' %} — {{ day_display }}{% endblock %}

{% block extracss %}
{# Leaflet must be a real <link> in <head>, not inside base.html's <style> block #}
<link rel="stylesheet" href="{% static 'leaflet/leaflet.css' %}">
{% endblock %}

{% block cssstyle %}
    /* Compact chrome on this page so map + day summary fit above the fold */
    .app-main {
        padding-top: 16px;
        padding-bottom: 40px;
    }
    .daymap-page .vehicle-chrome {
        margin-bottom: 12px;
        min-height: 0;
        padding: 6px 10px 6px 12px;
    }
    .daymap-page .page-heading {
        margin-bottom: 0.65rem;
    }
    .daymap-page .page-title--compact {
        font-size: clamp(1.25rem, 2.4vw, 1.65rem);
    }
    .daymap-charge-place .daymap-sc-link,
    .daymap-charge-curve {
        display: inline-block;
        margin-top: 4px;
        margin-right: 0.5rem;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #8ec8ff;
        background: rgba(77, 180, 255, 0.12);
        text-decoration: none;
        white-space: nowrap;
        border: none;
        cursor: pointer;
        font-family: inherit;
        line-height: inherit;
    }
    .daymap-charge-place .daymap-sc-link:hover,
    .daymap-charge-curve:hover {
        text-decoration: underline;
        color: #b8deff;
    }
    .daymap-charge-curve {
        color: #7ee0c3;
        background: rgba(47, 212, 161, 0.12);
    }
    .daymap-charge-curve:hover {
        color: #b6f0dd;
    }
    /* Two stacked session PNGs in the charge-curve lightbox */
    .daymap-curve-dialog {
        max-width: min(960px, 96vw);
        max-height: min(94vh, 1200px);
    }
    .daymap-curve-panels {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow-y: auto;
        max-height: min(78vh, 980px);
        padding: 0 4px 4px;
    }
    .daymap-curve-panel {
        margin: 0;
    }
    .daymap-curve-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.35rem;
        padding: 0 2px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #c5d6ef;
    }
    .daymap-curve-open-png {
        font-size: 0.78rem;
        font-weight: 600;
        color: #8ec8ff;
        text-decoration: none;
        white-space: nowrap;
    }
    .daymap-curve-open-png:hover {
        text-decoration: underline;
        color: #b8deff;
    }
    .daymap-curve-media {
        min-height: 0;
    }
    .daymap-curve-media img {
        width: 100%;
        height: auto;
        max-height: none;
    }
    .daymap-page .page-subtitle {
        margin-top: 4px;
        font-size: 0.9rem;
    }
    .daymap-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.65rem !important;
        padding: 10px 12px !important;
    }
    .daymap-toolbar form#daymap-form {
        display: inline-flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        flex: 0 0 auto;
        width: auto;
        max-width: none;
    }
    /* Bootstrap .form-control is width:100% — that wraps the Go button under the date */
    .daymap-toolbar .form-control,
    .daymap-toolbar .form-control-sm,
    .daymap-toolbar input[type="date"] {
        width: auto !important;
        max-width: 11.5rem;
        min-height: 36px !important;
        height: 36px;
        padding: 4px 10px !important;
        flex: 0 0 auto;
    }
    .daymap-toolbar .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        height: 36px;
        margin: 0;
        flex: 0 0 auto;
        white-space: nowrap;
        line-height: 1.2;
        padding-top: 0;
        padding-bottom: 0;
    }
    .daymap-toolbar .btn-outline-primary {
        min-width: 36px;
        padding-left: 0.55rem;
        padding-right: 0.55rem;
    }
    /* Was min(70vh, 640px) — too tall; keep summary (points / départ / arrivée / totals) on screen */
    .daymap-shell {
        margin-bottom: 0.75rem;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--app-line, #2a3548);
        background: #0d1524;
    }
    #daymap {
        height: clamp(200px, 28vh, 320px);
        width: 100%;
        position: relative;
        z-index: 0;
        overflow: hidden;
    }
    .daymap-meta {
        margin-top: 0 !important;
        padding: 14px 16px !important;
        /* Card must not clip table horizontal scroll on phones */
        overflow: visible;
        max-width: 100%;
    }
    .daymap-meta p {
        margin-bottom: 0.35rem;
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    .daymap-meta .table-responsive {
        margin-bottom: 0.35rem !important;
    }
    .daymap-meta .table {
        font-size: 0.85rem;
    }
    .daymap-meta .table th,
    .daymap-meta .table td {
        padding: 6px 8px;
    }
    .daymap-stops {
        overflow: visible;
        max-width: 100%;
    }
    /* Wide KPI / drives / charge tables: pan sideways on narrow screens.
       width:100% alone compresses columns so headers clip with no scroll. */
    .daymap-page .table-responsive {
        display: block;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        margin-left: 0;
        margin-right: 0;
        /* Subtle edge fade so it is obvious more columns exist */
        background:
            linear-gradient(to right, var(--app-surface, #121a28) 40%, rgba(18, 26, 40, 0)) left center / 18px 100% no-repeat local,
            linear-gradient(to left, var(--app-surface, #121a28) 40%, rgba(18, 26, 40, 0)) right center / 18px 100% no-repeat local;
    }
    .daymap-page .table-responsive > .table {
        width: max-content;
        min-width: 100%;
        max-width: none;
        margin-bottom: 0;
        font-size: 0.85rem;
    }
    .daymap-page .table-responsive > .table th,
    .daymap-page .table-responsive > .table td {
        white-space: nowrap;
    }
    /* Address column: wide enough to read on phone once you pan sideways.
       Horizontal scroll is expected — do not crush long Nominatim labels. */
    .daymap-page .table-responsive > .table td.small,
    .daymap-page .table-responsive > .table td:last-child {
        white-space: normal;
        min-width: 18rem;
        max-width: 28rem;
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    a.gmaps-pending {
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
        font-style: italic;
    }
    @media (max-height: 780px) {
        #daymap {
            height: clamp(180px, 24vh, 260px);
        }
        .daymap-page .page-heading__copy .eyebrow {
            display: none;
        }
    }
    @media (max-width: 700px) {
        .daymap-meta,
        .daymap-stops {
            padding-left: 12px !important;
            padding-right: 12px !important;
        }
        /* Pull scroll area to the card edge for a longer thumb swipe */
        .daymap-page .table-responsive {
            margin-left: -4px;
            margin-right: -4px;
            padding-bottom: 4px; /* room for scrollbar / thumb */
        }
    }
{% endblock %}

{% block body_class %}daymap-page{% endblock %}

{% block content %}
{% include 'matesla/_vehicle_chrome.html' %}

<div class="page-heading">
    <div class="page-heading__copy">
        <p class="eyebrow">{% trans 'Journey replay' %}</p>
        <h1 class="page-title page-title--compact">{% trans 'Where was the car' %} — {{ day_display }}</h1>
        <p class="page-subtitle text-muted small mb-0">{{ tz_name }} · {% trans 'drives, charges and GPS points' %}</p>
    </div>
</div>

<div class="daymap-toolbar" role="toolbar" aria-label="{% trans 'Day map' %}">
    {# Vehicle chrome already has My data / Day map / Firmware — keep only date navigation here #}
    <form method="get" action="{% url 'PersoDayMap' hashedVin %}" id="daymap-form">
        <a href="{% url 'PersoDayMapDay' hashedVin prev_day_iso %}" class="btn btn-outline-primary btn-sm" title="{% trans 'Previous day' %}" aria-label="{% trans 'Previous day' %}">←</a>
        <label class="sr-only" for="date_iso">{% trans 'Date' %}</label>
        <input type="date" name="date" id="date_iso" class="form-control form-control-sm"
               value="{{ day_iso }}" required
               title="{% trans 'Pick a date' %}">
        <button type="submit" class="btn btn-primary btn-sm">{% trans 'Go' %}</button>
        <a href="{% url 'PersoDayMapDay' hashedVin next_day_iso %}" class="btn btn-outline-primary btn-sm" title="{% trans 'Next day' %}" aria-label="{% trans 'Next day' %}">→</a>
    </form>
</div>

{% if parse_error %}
<div class="alert alert-warning" style="max-width: 1100px;">{{ parse_error }}</div>
{% endif %}

{% if has_track %}
{% if has_gps %}
<div class="matesla-map-shell daymap-shell" id="daymap-shell">
    <div id="daymap"></div>
</div>
{% else %}
<div class="daymap-empty"><p class="mb-0">{% trans 'No GPS points for this day (telemetry only).' %}</p></div>
{% endif %}
<div class="daymap-meta">
    <p class="mb-1">
        <strong>{% trans 'GPS points' %}:</strong> {{ total_points }}
        {% if path_points != total_points and path_points %}
        <span class="text-muted">({% blocktrans with n=path_points %}{{ n }} drawn on map{% endblocktrans %})</span>
        {% endif %}
        {% if start_time and end_time %}
        · <strong>{% trans 'Track' %}:</strong> {{ start_time }} → {{ end_time }}
        {% endif %}
        · <strong>{% trans 'Drives' %}:</strong> {{ drives|length }}
        · <strong>{% trans 'Charges' %}:</strong> {{ charges|length }}
    </p>
    {% if start_lat is not None %}
    <p class="mb-1"><strong>{% trans 'Start' %}:</strong>
        {% include 'personalstats/_gmaps_link.html' with lat=start_lat lon=start_lon label=start_addr %}
    </p>
    {% endif %}
    {% if end_lat is not None %}
    <p class="mb-1"><strong>{% trans 'End' %}:</strong>
        {% include 'personalstats/_gmaps_link.html' with lat=end_lat lon=end_lon label=end_addr %}
    </p>
    {% endif %}
    {% if unmonitored_tail %}
    <div class="alert alert-info py-2 px-3 mb-2" role="status" style="max-width: 1100px;">
        {{ unmonitored_tail.message }}
    </div>
    {% endif %}

    {# Day totals — drives aggregate + residual SoC (park / dog / sentry / …) #}
    <div class="table-responsive mb-2">
    <table class="table table-sm table-bordered mb-1">
        <thead>
        <tr>
            <th>{% trans 'Duration' %}</th>
            <th>{% trans 'Distance' %}</th>
            <th>{% trans 'Avg speed' %}</th>
            <th>{% trans 'SoC start' %}</th>
            <th>{% trans 'SoC end' %}</th>
            <th title="{% trans 'Sum of SoC used on drives only' %}">{% trans 'SoC used' %}</th>
            <th title="{% trans 'SoC drop not explained by drives (park climate, dog/camp, sentry, preconditioning, vampire drain), after accounting for charges' %}">{% trans 'SoC outside driving' %}</th>
            <th>{% trans 'kWh/100 km' %}</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>{% if day_duration_label %}{{ day_duration_label }}{% else %}—{% endif %}</td>
            <td>
                {% if miles_driven_km is not None %}{{ miles_driven_km|floatformat:1 }} km{% else %}—{% endif %}
                {% if miles_driven is not None %}<span class="text-muted small">({{ miles_driven|floatformat:1 }} mi)</span>{% endif %}
            </td>
            <td>
                {% if day_avg_kmh is not None %}{{ day_avg_kmh|floatformat:0 }} km/h{% else %}—{% endif %}
                {% if day_avg_mph is not None %}<span class="text-muted small">({{ day_avg_mph|floatformat:0 }} mi/h)</span>{% endif %}
            </td>
            <td>{% if day_soc_start is not None %}{{ day_soc_start|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if day_soc_end is not None %}{{ day_soc_end|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if day_soc_used is not None %}{{ day_soc_used|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if day_soc_non_drive is not None %}{{ day_soc_non_drive|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if day_kwh_per_100km is not None %}{{ day_kwh_per_100km|floatformat:1 }}{% else %}—{% endif %}</td>
        </tr>
        </tbody>
    </table>
    </div>

    <p class="text-muted small mb-0">
        {% blocktrans with kwh=pack_kwh_estimate|floatformat:0 %}kWh estimates use ~{{ kwh }} kWh pack (from EPA range).{% endblocktrans %}
        {% trans 'SoC outside driving = (start − end) − drive SoC + charged.' %}
    </p>
</div>

{% if drives %}
<div class="daymap-stops">
    <h5>{% trans 'Drives' %}</h5>
    <div class="table-responsive">
    <table class="table table-sm table-striped">
        <thead>
        <tr>
            <th>{% trans 'Departure' %}</th>
            <th>{% trans 'Arrival' %}</th>
            <th>{% trans 'Duration' %}</th>
            <th>{% trans 'Distance' %}</th>
            <th>{% trans 'Avg speed' %}</th>
            <th>{% trans 'SoC start' %}</th>
            <th>{% trans 'SoC end' %}</th>
            <th>{% trans 'SoC used' %}</th>
            <th>{% trans 'kWh/100 km' %}</th>
            <th>{% trans 'From → to' %}</th>
        </tr>
        </thead>
        <tbody>
        {% for d in drives %}
        <tr>
            <td>{{ d.start_local }}</td>
            <td>{{ d.end_local }}</td>
            <td>{{ d.minutes }} min</td>
            <td>
                {% if d.km is not None %}{{ d.km|floatformat:1 }} km{% else %}—{% endif %}
                {% if d.miles is not None %}<span class="text-muted small">({{ d.miles|floatformat:1 }} mi)</span>{% endif %}
            </td>
            <td>
                {% if d.avg_kmh is not None %}{{ d.avg_kmh|floatformat:0 }} km/h{% else %}—{% endif %}
                {% if d.avg_mph is not None %}<span class="text-muted small">({{ d.avg_mph|floatformat:0 }} mi/h)</span>{% endif %}
            </td>
            <td>{% if d.soc_start is not None %}{{ d.soc_start|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if d.soc_end is not None %}{{ d.soc_end|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if d.soc_used is not None %}{{ d.soc_used|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if d.kwh_per_100km is not None %}{{ d.kwh_per_100km|floatformat:1 }}{% else %}—{% endif %}</td>
            <td class="small">
                {% include 'personalstats/_gmaps_link.html' with lat=d.lat lon=d.lon label=d.start_address %}
                →
                {% include 'personalstats/_gmaps_link.html' with lat=d.end_lat lon=d.end_lon label=d.end_address %}
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endif %}

{% if charges %}
<div class="daymap-stops">
    <h5>{% trans 'Charging stops' %}</h5>
    <div class="table-responsive">
    <table class="table table-sm table-striped">
        <thead>
        <tr>
            <th>{% trans 'Start' %}</th>
            <th>{% trans 'End' %}</th>
            <th>{% trans 'Duration' %}</th>
            <th>{% trans 'SoC start' %}</th>
            <th>{% trans 'SoC end' %}</th>
            <th>{% trans 'SoC added' %}</th>
            <th>{% trans 'kWh added' %}</th>
            <th>{% trans 'Min power' %}</th>
            <th>{% trans 'Max power' %}</th>
            <th>{% trans 'Address' %}</th>
        </tr>
        </thead>
        <tbody>
        {% for c in charges %}
        <tr>
            <td>{{ c.start_local }}</td>
            <td>{{ c.end_local }}</td>
            <td>{{ c.minutes }} min</td>
            <td>{% if c.soc_start is not None %}{{ c.soc_start|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if c.soc_end is not None %}{{ c.soc_end|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if c.soc_added is not None %}+{{ c.soc_added|floatformat:1 }} %{% else %}—{% endif %}</td>
            <td>{% if c.kwh_added is not None %}{{ c.kwh_added|floatformat:2 }} kWh{% else %}—{% endif %}</td>
            <td>{% if c.min_power_kw is not None %}{{ c.min_power_kw|floatformat:1 }} kW{% else %}—{% endif %}</td>
            <td>{% if c.max_power_kw is not None %}{{ c.max_power_kw|floatformat:1 }} kW{% else %}—{% endif %}</td>
            <td class="small daymap-charge-place">
                {% include 'personalstats/_gmaps_link.html' with lat=c.lat lon=c.lon label=c.address %}
                {% if c.is_dc_candidate and c.start_ts %}
                <button type="button"
                        class="daymap-charge-curve"
                        data-session-curve="1"
                        data-graph-url-time="{% url 'PersoDayChargeSessionGraph' hashedVin day_iso c.start_ts 'power_vs_time' %}?size=full"
                        data-graph-url-soc="{% url 'PersoDayChargeSessionGraph' hashedVin day_iso c.start_ts 'power_vs_soc' %}?size=full"
                        data-curve-title="{% blocktrans with start=c.start_local end=c.end_local %}{{ start }}–{{ end }} · charge curve{% endblocktrans %}"
                        title="{% trans 'Open charge speed curves (power vs time, power vs SoC)' %}">
                    {% trans 'Curve' %}
                </button>
                {% endif %}
                {% if c.is_dc_candidate and c.lat is not None and c.lon is not None %}
                <span class="daymap-sc-slot"
                      data-sc-match="1"
                      data-lat="{% localize off %}{{ c.lat }}{% endlocalize %}"
                      data-lon="{% localize off %}{{ c.lon }}{% endlocalize %}"></span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endif %}

{% if not drives and not charges %}
<div class="daymap-empty mt-2">
    <p class="mb-0">{% trans 'No drive or charge segments detected for this day.' %}</p>
</div>
{% endif %}

{% else %}
<div class="daymap-empty">
    <p class="mb-0">{% trans 'No data for this day.' %}</p>
    <p class="text-muted small mb-0">{% trans 'Try another date with the arrows or the date picker.' %}</p>
</div>
{% endif %}

{# Lightbox: two separate PNGs (time / SoC) so each can be saved or printed #}
<div class="graph-lightbox" id="daymap-curve-lightbox" hidden>
    <div class="graph-lightbox__backdrop" data-curve-close tabindex="-1"></div>
    <div class="graph-lightbox__dialog daymap-curve-dialog" role="dialog" aria-modal="true" aria-labelledby="daymap-curve-title">
        <header class="graph-lightbox__header">
            <div>
                <p class="graph-lightbox__eyebrow">{% trans 'Fast charge' %}</p>
                <h2 class="graph-lightbox__title" id="daymap-curve-title"></h2>
            </div>
            <button type="button" class="graph-lightbox__close" data-curve-close
                    title="{% trans 'Close' %}" aria-label="{% trans 'Close' %}">×</button>
        </header>
        <div class="daymap-curve-panels">
            <figure class="daymap-curve-panel">
                <figcaption class="daymap-curve-caption">
                    <span>{% trans 'Power vs time' %}</span>
                    <a id="daymap-curve-link-time" href="#" target="_blank" rel="noopener"
                       class="daymap-curve-open-png">{% trans 'Open PNG' %}</a>
                </figcaption>
                <div class="graph-lightbox__media daymap-curve-media">
                    <img id="daymap-curve-img-time" alt="{% trans 'Charge power versus elapsed time' %}">
                </div>
            </figure>
            <figure class="daymap-curve-panel">
                <figcaption class="daymap-curve-caption">
                    <span>{% trans 'Power vs SoC' %}</span>
                    <a id="daymap-curve-link-soc" href="#" target="_blank" rel="noopener"
                       class="daymap-curve-open-png">{% trans 'Open PNG' %}</a>
                </figcaption>
                <div class="graph-lightbox__media daymap-curve-media">
                    <img id="daymap-curve-img-soc" alt="{% trans 'Charge power versus battery SoC' %}">
                </div>
            </figure>
        </div>
        <p class="graph-lightbox__hint text-muted">{% trans 'Two separate images — open PNG to save or print one curve. Press Esc or click outside to close.' %}</p>
    </div>
</div>

{% endblock %}

{% block javascript %}
<script src="{% static 'leaflet/leaflet.js' %}"></script>
<script src="{% static 'js/matesla-map-fullscreen.js' %}"></script>
<script>
(function () {
    // --- Async reverse-geocode: page shows lat/lon first, labels fill in later ---
    var resolveUrl = "{% url 'PersoResolveAddress' %}";
    var pending = document.querySelectorAll('a.gmaps-link[data-geocode="1"]');
    if (pending.length) {
        // Dedupe by lat,lon so one HTTP fills every matching link
        var queue = [];
        var seen = {};
        pending.forEach(function (el) {
            var key = el.getAttribute('data-lat') + ',' + el.getAttribute('data-lon');
            if (!seen[key]) {
                seen[key] = true;
                queue.push({
                    lat: el.getAttribute('data-lat'),
                    lon: el.getAttribute('data-lon')
                });
            }
        });
        function applyAddress(lat, lon, address) {
            // Match by the same data-lat/data-lon strings we put in the HTML
            document.querySelectorAll('a.gmaps-link[data-geocode="1"]').forEach(function (el) {
                if (el.getAttribute('data-lat') === lat && el.getAttribute('data-lon') === lon) {
                    el.textContent = address;
                    el.removeAttribute('data-geocode');
                    el.classList.remove('gmaps-pending');
                }
            });
        }
        function next() {
            if (!queue.length) return;
            var item = queue.shift();
            var url = resolveUrl + '?lat=' + encodeURIComponent(item.lat)
                + '&lon=' + encodeURIComponent(item.lon);
            fetch(url, { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.ok && data.address) {
                        // Use request keys (HTML data-*), not server-rounded floats
                        applyAddress(item.lat, item.lon, data.address);
                    }
                })
                .catch(function () { /* keep coords */ })
                .finally(function () {
                    // Server already enforces ~1 req/s; small gap keeps UI responsive
                    setTimeout(next, 50);
                });
        }
        next();
    }

    // --- Async Supercharger match (DC stops only; never blocks first paint) ---
    var scMatchUrl = "{% url 'PersoMatchSupercharger' %}";
    var scLabelSupercharger = "{% filter escapejs %}{% trans 'Supercharger' %}{% endfilter %}";
    var scSlots = document.querySelectorAll('[data-sc-match="1"]');
    if (scSlots.length) {
        var scQueue = [];
        var scSeen = {};
        scSlots.forEach(function (el) {
            var key = el.getAttribute('data-lat') + ',' + el.getAttribute('data-lon');
            if (!scSeen[key]) {
                scSeen[key] = true;
                scQueue.push({
                    lat: el.getAttribute('data-lat'),
                    lon: el.getAttribute('data-lon')
                });
            }
        });
        function applySupercharger(lat, lon, match) {
            if (!match || !match.url) return;
            document.querySelectorAll('[data-sc-match="1"]').forEach(function (el) {
                if (el.getAttribute('data-lat') !== lat || el.getAttribute('data-lon') !== lon) {
                    return;
                }
                if (el.getAttribute('data-sc-done') === '1') return;
                el.setAttribute('data-sc-done', '1');
                var label = scLabelSupercharger;
                if (match.power_kw) {
                    label += ' · ' + match.power_kw + ' kW';
                }
                if (match.name) {
                    label += ' — ' + match.name;
                }
                var a = document.createElement('a');
                a.className = 'daymap-sc-link';
                a.href = match.url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.title = match.name || scLabelSupercharger;
                a.textContent = label;
                el.appendChild(a);
            });
        }
        function scNext() {
            if (!scQueue.length) return;
            var item = scQueue.shift();
            var url = scMatchUrl
                + '?lat=' + encodeURIComponent(item.lat)
                + '&lon=' + encodeURIComponent(item.lon);
            fetch(url, { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.ok && data.match) {
                        applySupercharger(item.lat, item.lon, data.match);
                    }
                })
                .catch(function () { /* no badge */ })
                .finally(function () { setTimeout(scNext, 30); });
        }
        scNext();
    }

    // --- DC charge session curves: two PNGs (time + SoC) for save/print ---
    var curveLightbox = document.getElementById('daymap-curve-lightbox');
    var curveImgTime = document.getElementById('daymap-curve-img-time');
    var curveImgSoc = document.getElementById('daymap-curve-img-soc');
    var curveLinkTime = document.getElementById('daymap-curve-link-time');
    var curveLinkSoc = document.getElementById('daymap-curve-link-soc');
    var curveTitle = document.getElementById('daymap-curve-title');
    function ensureCurveLightboxOnBody() {
        if (curveLightbox && curveLightbox.parentNode !== document.body) {
            document.body.appendChild(curveLightbox);
        }
    }
    function withCacheBust(url) {
        if (!url) return url;
        return url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    }
    function openCurveLightbox(btn) {
        if (!curveLightbox || !btn) return;
        var urlTime = btn.getAttribute('data-graph-url-time');
        var urlSoc = btn.getAttribute('data-graph-url-soc');
        if (!urlTime && !urlSoc) return;
        ensureCurveLightboxOnBody();
        if (curveTitle) {
            curveTitle.textContent = btn.getAttribute('data-curve-title') || btn.textContent || '';
        }
        if (curveImgTime && urlTime) {
            curveImgTime.src = withCacheBust(urlTime);
            if (curveLinkTime) curveLinkTime.href = urlTime;
        }
        if (curveImgSoc && urlSoc) {
            curveImgSoc.src = withCacheBust(urlSoc);
            if (curveLinkSoc) curveLinkSoc.href = urlSoc;
        }
        curveLightbox.hidden = false;
        document.body.classList.add('graph-lightbox-open');
        var closeBtn = curveLightbox.querySelector('.graph-lightbox__close');
        if (closeBtn) closeBtn.focus();
    }
    function closeCurveLightbox() {
        if (!curveLightbox || curveLightbox.hidden) return;
        curveLightbox.hidden = true;
        document.body.classList.remove('graph-lightbox-open');
        if (curveImgTime) curveImgTime.removeAttribute('src');
        if (curveImgSoc) curveImgSoc.removeAttribute('src');
    }
    ensureCurveLightboxOnBody();
    document.querySelectorAll('[data-session-curve="1"]').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            openCurveLightbox(btn);
        });
    });
    if (curveLightbox) {
        curveLightbox.querySelectorAll('[data-curve-close]').forEach(function (el) {
            el.addEventListener('click', function (ev) {
                ev.preventDefault();
                closeCurveLightbox();
            });
        });
    }
    document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') closeCurveLightbox();
    });

    {% if has_gps %}
    var path = {{ path_json|safe }};
    if (!path || !path.length || typeof L === 'undefined') return;
    // Default marker icons: absolute URLs under our static tree (not CDN)
    var leafletIconBase = "{% static 'leaflet/images/' %}";
    L.Icon.Default.mergeOptions({
        iconUrl: leafletIconBase + 'marker-icon.png',
        iconRetinaUrl: leafletIconBase + 'marker-icon-2x.png',
        shadowUrl: leafletIconBase + 'marker-shadow.png'
    });
    var map = L.map('daymap');
    // Raster tiles still come from OSM at runtime (not a vendored JS/CSS asset;
    // self-hosting the planet is out of scope). Library code is fully local.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    var latlngs = path.map(function (p) { return [p.lat, p.lon]; });
    var line = L.polyline(latlngs, { color: '#0d6efd', weight: 4, opacity: 0.85 }).addTo(map);
    var start = path[0];
    var end = path[path.length - 1];
    L.marker([start.lat, start.lon]).addTo(map).bindPopup('{% trans "Start" %}: ' + start.t);
    if (path.length > 1) {
        L.marker([end.lat, end.lon]).addTo(map).bindPopup('{% trans "End" %}: ' + end.t);
    }
    map.fitBounds(line.getBounds(), { padding: [30, 30] });
    // Container may have been layout-incomplete at init; force correct size
    setTimeout(function () { map.invalidateSize(); }, 0);
    if (typeof mateslaAttachMapFullscreen === "function") {
        mateslaAttachMapFullscreen(map, document.getElementById("daymap-shell") || map.getContainer(), {
            enter: "{% filter escapejs %}{% trans 'Fullscreen map' %}{% endfilter %}",
            exit: "{% filter escapejs %}{% trans 'Exit fullscreen' %}{% endfilter %}",
            position: "topleft"
        });
    }
    {% endif %}
})();
</script>
{% endblock %}
