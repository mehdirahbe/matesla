{% load i18n %}

<div class="stats-toolbar">
    <a href="{% url 'AllMyDataAsCSV' hashedVin %}" class="btn btn-info btn-sm">{% trans 'Download my Data' %}</a>
    <a href="{% url 'PersoDayMap' hashedVin %}" class="btn btn-success btn-sm">{% trans 'Day map' %}</a>
    <label class="sr-only" for="DesiredPeriod">{% trans 'Period' %}</label>
    <select id="DesiredPeriod" class="form-control form-control-sm" style="width:auto;">
        <option value="1">{% trans '1 Week' %}</option>
        <option value="2">{% trans '2 Weeks' %}</option>
        <option value="4" selected>{% trans '1 Month' %}</option>
        <option value="13">{% trans '3 Months' %}</option>
        <option value="26">{% trans '6 Months' %}</option>
        <option value="52">{% trans '1 Year' %}</option>
        <option value="104">{% trans '2 Years' %}</option>
        <option value="260">{% trans '5 Years' %}</option>
        <option value="520">{% trans '10 Years' %}</option>
    </select>
</div>

<section class="graph-panel app-card">
    <h3 class="app-card__title">{% trans 'Battery degradation graphs' %}</h3>
    <div class="graph-panel__controls">
        <select id="degradationGraphCriteria" class="form-control form-control-sm">
            <option value="0" selected>{% trans 'Degradation vs odometer' %}</option>
            <option value="1">{% trans 'Degradation over time' %}</option>
            <option value="2">{% trans 'Range at full charge vs odometer' %}</option>
            <option value="3">{% trans 'Range at full charge over time' %}</option>
        </select>
    </div>
    <div class="graph-panel__figure">
        <img id="degradationGraphImg" class="lazyload graph-img"
             alt="{% trans 'Battery degradation graphs' %}"
             data-src="{% url 'PersoStatsBatteryDegradationGraph' hashedVin 'odometer' 4 %}"
             width="1200" height="500">
    </div>
</section>

<section class="graph-panel app-card">
    <h3 class="app-card__title">{% trans 'Charge related graphs' %}</h3>
    <div class="graph-panel__controls">
        <select id="chargeGraphCriteria" class="form-control form-control-sm">
            <option value="0" selected>{{ battery_level }}</option>
            <option value="1">{{ battery_range }}</option>
            <option value="2">{{ charge_limit_soc }}</option>
            <option value="3">{{ charge_rate }}</option>
            <option value="4">{{ charger_power }}</option>
        </select>
    </div>
    <div class="graph-panel__figure">
        <img id="chargeGraphImg" class="lazyload graph-img"
             alt="{% trans 'Charge related graphs' %}"
             data-src="{% url 'StatsOnCarGraph' hashedVin 'battery_level' 4 %}"
             width="1200" height="500">
    </div>
</section>

<section class="graph-panel app-card">
    <h3 class="app-card__title">{% trans 'Temperature related graphs' %}</h3>
    <div class="graph-panel__controls">
        <select id="temperatureGraphCriteria" class="form-control form-control-sm">
            <option value="0" selected>{{ outside_temp }}</option>
            <option value="1">{{ inside_temp }}</option>
        </select>
    </div>
    <div class="graph-panel__figure">
        <img id="temperatureGraphImg" class="lazyload graph-img"
             alt="{% trans 'Temperature related graphs' %}"
             data-src="{% url 'StatsOnCarGraph' hashedVin 'outside_temp' 4 %}"
             width="1200" height="500">
    </div>
</section>

<section class="graph-panel app-card">
    <h3 class="app-card__title">{% trans 'Drive related graphs' %}</h3>
    <div class="graph-panel__controls">
        <select id="driveGraphCriteria" class="form-control form-control-sm">
            <option value="0" selected>{{ odometer }}</option>
            <option value="1">{{ speed }}</option>
            <option value="2">{{ power }}</option>
        </select>
    </div>
    <div class="graph-panel__figure">
        <img id="driveGraphImg" class="lazyload graph-img"
             alt="{% trans 'Drive related graphs' %}"
             data-src="{% url 'StatsOnCarGraph' hashedVin 'odometer' 4 %}"
             width="1200" height="500">
    </div>
</section>
