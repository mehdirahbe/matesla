{% load i18n %}

<div class="stats-toolbar">
    <div class="stats-toolbar__actions">
        <a href="{% url 'PersoDayMap' hashedVin %}" class="btn btn-success btn-sm">{% trans 'Day map' %} <span aria-hidden="true">↗</span></a>
        <a href="{% url 'AllMyDataAsCSV' hashedVin %}" class="btn btn-secondary btn-sm">{% trans 'Download my Data' %}</a>
    </div>
    <div class="stats-toolbar__period">
        <label for="DesiredPeriod">{% trans 'Period' %}</label>
        <select id="DesiredPeriod">
            <option value="1">{% trans '1 Week' %}</option>
            <option value="2">{% trans '2 Weeks' %}</option>
            <option value="4" selected>{% trans '1 Month' %}</option>
            <option value="13">{% trans '3 Months' %}</option>
            <option value="26">{% trans '6 Months' %}</option>
            <option value="52">{% trans '1 Year' %}</option>
            <option value="104">{% trans '2 Years' %}</option>
            <option value="260">{% trans '5 Years' %}</option>
            <option value="520">{% trans '10 Years' %}</option>
        </select>
    </div>
</div>

<section class="graph-grid" aria-label="{% trans 'Personal charts' %}">
    <article class="graph-card graph-card--full">
        <header class="graph-card__header">
            <div>
                <span class="graph-card__index">01 · BATTERY HEALTH</span>
                <h2>{% trans 'Battery degradation graphs' %}</h2>
            </div>
        </header>
        <div class="graph-card__controls">
            <label class="sr-only" for="degradationGraphCriteria">{% trans 'Battery graph' %}</label>
            <select id="degradationGraphCriteria">
                <option value="0" selected>{% trans 'Degradation vs odometer' %}</option>
                <option value="1">{% trans 'Degradation over time' %}</option>
                <option value="2">{% trans 'Range at full charge vs odometer' %}</option>
                <option value="3">{% trans 'Range at full charge over time' %}</option>
            </select>
        </div>
        <div class="graph-card__media">
            <img id="degradationGraphImg" class="lazyload" alt="{% trans 'Battery degradation graphs' %}"
                 data-src="{% url 'PersoStatsBatteryDegradationGraph' hashedVin 'odometer' 4 %}" width="1200" height="500">
        </div>
    </article>

    <article class="graph-card">
        <header class="graph-card__header">
            <div>
                <span class="graph-card__index">02 · CHARGE</span>
                <h2>{% trans 'Charge related graphs' %}</h2>
            </div>
        </header>
        <div class="graph-card__controls">
            <label class="sr-only" for="chargeGraphCriteria">{% trans 'Charge graph' %}</label>
            <select id="chargeGraphCriteria">
                <option value="0" selected>{{ battery_level }}</option>
                <option value="1">{{ battery_range }}</option>
                <option value="2">{{ charge_limit_soc }}</option>
                <option value="3">{{ charge_rate }}</option>
                <option value="4">{{ charger_power }}</option>
            </select>
        </div>
        <div class="graph-card__media">
            <img id="chargeGraphImg" class="lazyload" alt="{% trans 'Charge related graphs' %}"
                 data-src="{% url 'StatsOnCarGraph' hashedVin 'battery_level' 4 %}" width="1200" height="500">
        </div>
    </article>

    <article class="graph-card">
        <header class="graph-card__header">
            <div>
                <span class="graph-card__index">03 · CLIMATE</span>
                <h2>{% trans 'Temperature related graphs' %}</h2>
            </div>
        </header>
        <div class="graph-card__controls">
            <label class="sr-only" for="temperatureGraphCriteria">{% trans 'Temperature graph' %}</label>
            <select id="temperatureGraphCriteria">
                <option value="0" selected>{{ outside_temp }}</option>
                <option value="1">{{ inside_temp }}</option>
            </select>
        </div>
        <div class="graph-card__media">
            <img id="temperatureGraphImg" class="lazyload" alt="{% trans 'Temperature related graphs' %}"
                 data-src="{% url 'StatsOnCarGraph' hashedVin 'outside_temp' 4 %}" width="1200" height="500">
        </div>
    </article>

    <article class="graph-card graph-card--full">
        <header class="graph-card__header">
            <div>
                <span class="graph-card__index">04 · DRIVE</span>
                <h2>{% trans 'Drive related graphs' %}</h2>
            </div>
        </header>
        <div class="graph-card__controls">
            <label class="sr-only" for="driveGraphCriteria">{% trans 'Drive graph' %}</label>
            <select id="driveGraphCriteria">
                <option value="0" selected>{{ odometer }}</option>
                <option value="1">{{ speed }}</option>
                <option value="2">{{ power }}</option>
            </select>
        </div>
        <div class="graph-card__media">
            <img id="driveGraphImg" class="lazyload" alt="{% trans 'Drive related graphs' %}"
                 data-src="{% url 'StatsOnCarGraph' hashedVin 'odometer' 4 %}" width="1200" height="500">
        </div>
    </article>
</section>
