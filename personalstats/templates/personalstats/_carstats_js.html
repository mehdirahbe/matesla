{% load static %}
<script>
/*also inspired from stackoverflow*/
// Placeholder 123456789 in URLs is replaced by #DesiredPeriod (weeks).
// ?size=thumb for grid cards, ?size=full when expanded in lightbox.

function withGraphSize(url, size) {
    if (!url) return url;
    try {
        var u = new URL(url, window.location.origin);
        u.searchParams.set("size", size);
        return u.pathname + u.search + u.hash;
    } catch (e) {
        var hash = "";
        var base = url;
        var hi = url.indexOf("#");
        if (hi >= 0) {
            hash = url.slice(hi);
            base = url.slice(0, hi);
        }
        if (/([?&])size=/.test(base)) {
            base = base.replace(/([?&])size=[^&]*/, "$1size=" + size);
        } else {
            base += (base.indexOf("?") >= 0 ? "&" : "?") + "size=" + size;
        }
        return base + hash;
    }
}

//For temperature carousel item (same order as #temperatureGraphCriteria)
var temperaturepictureList = [
"{% url 'StatsOnCarGraph' hashedVin 'outside_temp' 123456789%}",
"{% url 'StatsOnCarGraph' hashedVin 'inside_temp' 123456789%}",
 ];

function ChangeTemperatureImageSourceFunction()
{
    var choiceSelectItem = parseInt($('#temperatureGraphCriteria').val());
    var choiceDesiredPeriod = parseInt($('#DesiredPeriod').val());//Period in weeks
    var url = withGraphSize(
        temperaturepictureList[choiceSelectItem].replace("123456789", choiceDesiredPeriod),
        "thumb"
    );
    // set both: lazysizes uses data-src; src forces immediate reload when user changes period
    $('#temperatureGraphImg').attr({"data-src": url, "src": url});
    refreshOpenLightboxIfNeeded("temperature");
}

function syncVehicleSwitchPeriod()
{
    // Hidden field on vehicle switcher form — keep period when changing car
    var periodSelect = document.getElementById('DesiredPeriod');
    var hidden = document.getElementById('vehicle_switch_period');
    if (periodSelect && hidden) {
        hidden.value = periodSelect.value;
    }
}

function ChangeDesiredPeriodFunction()
{
    //When period changes, all graphs must be refreshed to reflect new period
    ChangeBatteryDegradationImageSourceFunction();
    ChangeChargeImageSourceFunction();
    ChangeUsageImageSourceFunction();
    ChangeTemperatureImageSourceFunction();
    ChangeDriveImageSourceFunction();
    syncVehicleSwitchPeriod();
    if (typeof reloadLifetimeMap === "function") {
        reloadLifetimeMap();
    }
}

$('#DesiredPeriod').change(ChangeDesiredPeriodFunction);

// --- Expand chart (compact grid → lightbox, AWS-style) ---
// Hoisted so Change* functions above can call refreshOpenLightboxIfNeeded.
var activeGraphCard = null;

function graphImageUrl(img) {
    if (!img) return "";
    return img.currentSrc || img.src || img.getAttribute("data-src") || "";
}

function refreshOpenLightboxIfNeeded(cardKey) {
    if (!activeGraphCard) return;
    if (cardKey && activeGraphCard.getAttribute("data-graph-card") !== cardKey) return;
    var img = activeGraphCard.querySelector(".graph-card__media img");
    var lightImg = document.getElementById("graph-lightbox-img");
    var url = graphImageUrl(img);
    if (lightImg && url) lightImg.src = withGraphSize(url, "full");
}

function ensureLightboxOnBody(lightbox) {
    // Avoid position:fixed being trapped by transformed ancestors — pin to body.
    if (lightbox && lightbox.parentNode !== document.body) {
        document.body.appendChild(lightbox);
    }
}

function openGraphLightbox(card) {
    var lightbox = document.getElementById("graph-lightbox");
    var lightImg = document.getElementById("graph-lightbox-img");
    if (!lightbox || !lightImg || !card) return;

    var titleEl = card.querySelector(".graph-card__header h2");
    var indexEl = card.querySelector(".graph-card__index");
    var img = card.querySelector(".graph-card__media img");
    var url = graphImageUrl(img);
    if (!url) return;

    ensureLightboxOnBody(lightbox);

    activeGraphCard = card;
    document.getElementById("graph-lightbox-title").textContent =
        titleEl ? titleEl.textContent.trim() : "";
    document.getElementById("graph-lightbox-index").textContent =
        indexEl ? indexEl.textContent.trim() : "";
    lightImg.alt = img ? (img.alt || "") : "";
    // Full-resolution dark graph for the expanded view
    lightImg.src = withGraphSize(url, "full");

    lightbox.hidden = false;
    document.body.classList.add("graph-lightbox-open");

    // Bring the expanded dialog into the viewport (no page scroll needed).
    var dialog = lightbox.querySelector(".graph-lightbox__dialog");
    if (dialog) {
        // Reset any internal scroll first
        var media = lightbox.querySelector(".graph-lightbox__media");
        if (media) media.scrollTop = 0;
        dialog.scrollIntoView({ block: "center", inline: "nearest", behavior: "auto" });
    }
    var closeBtn = lightbox.querySelector(".graph-lightbox__close");
    if (closeBtn) closeBtn.focus();
}

function closeGraphLightbox() {
    var lightbox = document.getElementById("graph-lightbox");
    if (!lightbox || lightbox.hidden) return;
    lightbox.hidden = true;
    document.body.classList.remove("graph-lightbox-open");
    var lightImg = document.getElementById("graph-lightbox-img");
    if (lightImg) lightImg.removeAttribute("src");
    activeGraphCard = null;
}

// Capture period right before the vehicle form posts (onchange submit)
$(function () {
    var vehicleForm = document.querySelector('form.vehicle-switcher');
    if (vehicleForm) {
        vehicleForm.addEventListener('submit', syncVehicleSwitchPeriod);
    }
    var vehicleSelect = document.getElementById('vehicle_api_id');
    if (vehicleSelect) {
        vehicleSelect.addEventListener('change', syncVehicleSwitchPeriod);
    }
    // Mount lightbox on body ASAP so fixed positioning tracks the viewport
    ensureLightboxOnBody(document.getElementById("graph-lightbox"));

    // Sync hidden vehicle-switch period only. Do NOT call ChangeDesiredPeriodFunction()
    // on first paint: it forces src= on every card and regenerates 5 PNGs even when
    // data-src already matches #DesiredPeriod. lazysizes loads data-src; changing
    // the period select still calls ChangeDesiredPeriodFunction via .change().
    syncVehicleSwitchPeriod();

    document.querySelectorAll("[data-graph-expand]").forEach(function (btn) {
        btn.addEventListener("click", function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            openGraphLightbox(btn.closest("[data-graph-card]"));
        });
    });
    document.querySelectorAll("[data-graph-media]").forEach(function (media) {
        media.addEventListener("click", function () {
            openGraphLightbox(media.closest("[data-graph-card]"));
        });
    });
    document.querySelectorAll("[data-graph-close]").forEach(function (el) {
        el.addEventListener("click", function (ev) {
            ev.preventDefault();
            closeGraphLightbox();
        });
    });
    document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") closeGraphLightbox();
    });
});

// --- Lifetime map (Leaflet under charts; period follows #DesiredPeriod) ---
var lifetimeMapState = {
    map: null,
    layer: null,
    loading: false,
    pendingReload: false,
    loadedKey: null,
    assetsReady: false,
    fullscreen: null
};

function ensureMapFullscreenScript() {
    return new Promise(function (resolve, reject) {
        if (typeof window.mateslaAttachMapFullscreen === "function") {
            resolve();
            return;
        }
        var existing = document.querySelector("script[data-matesla-map-fs]");
        if (existing) {
            existing.addEventListener("load", function () { resolve(); });
            existing.addEventListener("error", function () { reject(new Error("map-fs")); });
            return;
        }
        var script = document.createElement("script");
        script.src = "{% static 'js/matesla-map-fullscreen.js' %}";
        script.async = true;
        script.setAttribute("data-matesla-map-fs", "1");
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error("map-fs")); };
        document.head.appendChild(script);
    });
}

function lifetimeMapI18n() {
    return {
        loading: "{% filter escapejs %}{% trans 'Loading map…' %}{% endfilter %}",
        empty: "{% filter escapejs %}{% trans 'No GPS track for this period.' %}{% endfilter %}",
        error: "{% filter escapejs %}{% trans 'Could not load the map.' %}{% endfilter %}",
        days: "{% filter escapejs %}{% trans 'd' %}{% endfilter %}",
        hours: "{% filter escapejs %}{% trans 'h' %}{% endfilter %}",
        minutes: "{% filter escapejs %}{% trans 'min' %}{% endfilter %}"
    };
}

function ensureLeafletAssets(root) {
    return new Promise(function (resolve, reject) {
        if (typeof L !== "undefined") {
            lifetimeMapState.assetsReady = true;
            resolve();
            return;
        }
        var cssHref = root.getAttribute("data-leaflet-css");
        var jsSrc = root.getAttribute("data-leaflet-js");
        if (!jsSrc) {
            reject(new Error("missing leaflet"));
            return;
        }
        if (cssHref && !document.querySelector('link[data-lifetime-leaflet]')) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = cssHref;
            link.setAttribute("data-lifetime-leaflet", "1");
            document.head.appendChild(link);
        }
        var existing = document.querySelector("script[data-lifetime-leaflet]");
        if (existing) {
            existing.addEventListener("load", function () { resolve(); });
            existing.addEventListener("error", function () { reject(new Error("leaflet")); });
            return;
        }
        var script = document.createElement("script");
        script.src = jsSrc;
        script.async = true;
        script.setAttribute("data-lifetime-leaflet", "1");
        script.onload = function () {
            lifetimeMapState.assetsReady = true;
            resolve();
        };
        script.onerror = function () { reject(new Error("leaflet")); };
        document.head.appendChild(script);
    });
}

function formatDriveTime(dt, i18n) {
    if (!dt) return "—";
    var parts = [];
    if (dt.days) parts.push(dt.days + "\u00a0" + i18n.days);
    if (dt.hours || dt.days) parts.push(dt.hours + "\u00a0" + i18n.hours);
    parts.push(dt.minutes + "\u00a0" + i18n.minutes);
    return parts.join(" ");
}

function fmtNum(v, digits) {
    if (v === null || v === undefined || v === "") return "—";
    var n = Number(v);
    if (!isFinite(n)) return "—";
    if (digits === 0) return String(Math.round(n));
    return n.toLocaleString(undefined, {
        maximumFractionDigits: digits == null ? 1 : digits,
        minimumFractionDigits: 0
    });
}

function fillLifetimeKpis(data) {
    var root = document.getElementById("lifetime-kpis");
    if (!root || !data) return;
    root.hidden = false;
    var i18n = lifetimeMapI18n();
    var set = function (key, text) {
        var el = root.querySelector('[data-k="' + key + '"]');
        if (el) el.textContent = text;
    };
    set("drives", fmtNum(data.drives, 0));
    set("km_driven", data.km_driven != null ? fmtNum(data.km_driven, 0) + "\u00a0km" : "—");
    set("rated_km_used", data.rated_km_used != null ? fmtNum(data.rated_km_used, 0) + "\u00a0km" : "—");
    set("wh_per_km", data.wh_per_km != null ? fmtNum(data.wh_per_km, 0) + "\u00a0Wh/km" : "—");
    set("efficiency_pct", data.efficiency_pct != null ? fmtNum(data.efficiency_pct, 1) + "\u00a0%" : "—");
    set("kwh_used", data.kwh_used != null ? fmtNum(data.kwh_used, 1) + "\u00a0kWh" : "—");
    set("avg_kmh", data.avg_kmh != null ? fmtNum(data.avg_kmh, 1) + "\u00a0km/h" : "—");
    set("avg_temp_c", data.avg_temp_c != null ? fmtNum(data.avg_temp_c, 1) + "\u00a0°C" : "—");
    set("drive_time", formatDriveTime(data.drive_time, i18n));
}

function setLifetimeStatus(text, isError) {
    var el = document.getElementById("lifetime-map-status");
    if (!el) return;
    if (!text) {
        el.hidden = true;
        el.textContent = "";
        return;
    }
    el.hidden = false;
    el.textContent = text;
    el.classList.toggle("lifetime-map-status--error", !!isError);
}

function drawLifetimeMap(data) {
    var mapEl = document.getElementById("lifetime-map");
    var root = document.querySelector("[data-lifetime-map]");
    if (!mapEl || typeof L === "undefined") return;

    var iconBase = root ? root.getAttribute("data-leaflet-icon-base") : "";
    if (iconBase) {
        L.Icon.Default.mergeOptions({
            iconUrl: iconBase + "marker-icon.png",
            iconRetinaUrl: iconBase + "marker-icon-2x.png",
            shadowUrl: iconBase + "marker-shadow.png"
        });
    }

    // Force a real box size before Leaflet measures the container
    if (!mapEl.style.height) {
        mapEl.style.height = "360px";
    }
    mapEl.style.width = "100%";

    if (!lifetimeMapState.map) {
        lifetimeMapState.map = L.map(mapEl, {
            zoomControl: true,
            attributionControl: true
        });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(lifetimeMapState.map);
        // Fullscreen control (also wires header expand button)
        var shell = document.getElementById("lifetime-map-shell") || mapEl.parentElement;
        ensureMapFullscreenScript().then(function () {
            if (lifetimeMapState.fullscreen || !window.mateslaAttachMapFullscreen) return;
            lifetimeMapState.fullscreen = window.mateslaAttachMapFullscreen(
                lifetimeMapState.map,
                shell,
                {
                    enter: "{% filter escapejs %}{% trans 'Fullscreen map' %}{% endfilter %}",
                    exit: "{% filter escapejs %}{% trans 'Exit fullscreen' %}{% endfilter %}",
                    position: "topleft",
                    externalButton: document.getElementById("lifetime-map-expand"),
                }
            );
        }).catch(function () { /* optional control */ });
    }
    if (lifetimeMapState.layer) {
        lifetimeMapState.map.removeLayer(lifetimeMapState.layer);
        lifetimeMapState.layer = null;
    }

    var segments = (data.segments || []).filter(function (seg) {
        return seg && seg.length >= 2;
    });
    if (!segments.length) return;

    var lineOpts = {
        color: "#4db4ff",
        weight: 3,
        opacity: 0.88,
        lineJoin: "round",
        lineCap: "round",
        smoothFactor: 1.2
    };
    // Prefer multi-polyline; fall back to a feature group if needed
    var layer;
    try {
        layer = L.polyline(segments, lineOpts);
        layer.addTo(lifetimeMapState.map);
    } catch (e1) {
        layer = L.featureGroup();
        segments.forEach(function (seg) {
            L.polyline(seg, lineOpts).addTo(layer);
        });
        layer.addTo(lifetimeMapState.map);
    }
    lifetimeMapState.layer = layer;

    try {
        var bounds = layer.getBounds();
        if (bounds && bounds.isValid()) {
            lifetimeMapState.map.fitBounds(bounds, { padding: [28, 28], maxZoom: 12 });
        } else {
            lifetimeMapState.map.setView([50.85, 4.35], 6);
        }
    } catch (e) {
        lifetimeMapState.map.setView([50.85, 4.35], 6);
    }
    // invalidateSize after layout (container may have been height:0 on first paint)
    setTimeout(function () {
        if (lifetimeMapState.map) lifetimeMapState.map.invalidateSize();
    }, 80);
    setTimeout(function () {
        if (lifetimeMapState.map) lifetimeMapState.map.invalidateSize();
    }, 400);
}

function reloadLifetimeMap() {
    var root = document.querySelector("[data-lifetime-map]");
    if (!root) return;
    var baseUrl = root.getAttribute("data-url");
    if (!baseUrl) return;
    var periodEl = document.getElementById("DesiredPeriod");
    var period = periodEl ? periodEl.value : "520";
    var key = period;
    if (lifetimeMapState.loading) {
        // Period changed while a fetch is in flight — rerun when it finishes
        lifetimeMapState.pendingReload = true;
        return;
    }
    lifetimeMapState.loading = true;
    lifetimeMapState.pendingReload = false;
    lifetimeMapState.loadedKey = key;

    var i18n = lifetimeMapI18n();
    setLifetimeStatus(i18n.loading, false);

    ensureLeafletAssets(root)
        .then(function () {
            var url = baseUrl + (baseUrl.indexOf("?") >= 0 ? "&" : "?") + "period=" + encodeURIComponent(period);
            return fetch(url, { credentials: "same-origin", headers: { "Accept": "application/json" } });
        })
        .then(function (r) {
            if (!r.ok) throw new Error("http " + r.status);
            return r.json();
        })
        .then(function (data) {
            lifetimeMapState.loading = false;
            // Stale response if user changed period mid-flight
            var cur = periodEl ? periodEl.value : period;
            if (String(cur) !== String(key) || lifetimeMapState.pendingReload) {
                lifetimeMapState.pendingReload = false;
                reloadLifetimeMap();
                return;
            }
            if (!data || !data.ok) throw new Error("bad payload");
            fillLifetimeKpis(data);
            if (!data.has_track || !(data.segments && data.segments.length)) {
                setLifetimeStatus(i18n.empty, false);
                if (lifetimeMapState.layer && lifetimeMapState.map) {
                    lifetimeMapState.map.removeLayer(lifetimeMapState.layer);
                    lifetimeMapState.layer = null;
                }
            } else {
                drawLifetimeMap(data);
                setLifetimeStatus("", false);
            }
        })
        .catch(function () {
            lifetimeMapState.loading = false;
            if (lifetimeMapState.pendingReload) {
                lifetimeMapState.pendingReload = false;
                reloadLifetimeMap();
                return;
            }
            lifetimeMapState.loadedKey = null;
            setLifetimeStatus(lifetimeMapI18n().error, true);
        });
}

$(function () {
    var root = document.querySelector("[data-lifetime-map]");
    if (!root) return;
    // Lazy: load when card is near viewport (or immediately if already visible)
    if ("IntersectionObserver" in window) {
        var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) {
                    obs.disconnect();
                    reloadLifetimeMap();
                }
            });
        }, { rootMargin: "200px" });
        obs.observe(root);
    } else {
        reloadLifetimeMap();
    }
});

</script>
