[Login]
# Sur secteur : le couvercle fermé ne suspend pas (Tailscale, cron).
# GDM a une seconde couche, dans gdm-no-suspend-ac.conf : au verrouillage
# c'est son settings-daemon qui appelle Suspend(), pas seulement logind.
HandleLidSwitchExternalPower=ignore
# Sur batterie : suspend classique si couvercle fermé.
HandleLidSwitch=suspend