# Session GDM (écran de connexion et session verrouillée), sur secteur.
# Le compte utilisateur ne s'applique plus une fois l'écran verrouillé.
# Sur batterie, les défauts GDM restent en place (veille au couvercle fermé).
[org/gnome/settings-daemon/plugins/power]
lid-close-ac-action='nothing'
sleep-inactive-ac-type='nothing'
