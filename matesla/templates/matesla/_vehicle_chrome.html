{% load i18n %}
<div class="vehicle-chrome">
    {% if user_vehicles and user_vehicles|length > 0 %}
    <form action="{% url 'select_vehicle' %}" method="post" class="vehicle-switcher">
        {% csrf_token %}
        <span class="vehicle-switcher__state" aria-hidden="true"></span>
        <div>
            <label for="vehicle_api_id">{% trans 'Vehicle' %}</label>
            <select name="vehicle_api_id" id="vehicle_api_id" onchange="this.form.submit()">
                {% for v in user_vehicles %}
                <option value="{{ v.api_id }}" {% if active_vehicle_api_id == v.api_id %}selected{% endif %}>
                    {{ v.label }}{% if v.state %} · {{ v.state }}{% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        <noscript><button type="submit" class="btn btn-sm btn-secondary">OK</button></noscript>
    </form>
    {% elif active_vehicle_label %}
    <div class="vehicle-switcher">
        <span class="vehicle-switcher__state" aria-hidden="true"></span>
        <div>
            <label>{% trans 'Vehicle' %}</label>
            <div class="vehicle-switcher__name">{{ active_vehicle_label }}</div>
        </div>
    </div>
    {% else %}
    <div class="vehicle-switcher">
        <span class="vehicle-switcher__state" aria-hidden="true"></span>
        <div class="vehicle-switcher__name">MaTesla</div>
    </div>
    {% endif %}

    <nav class="vehicle-chrome__links" aria-label="{% trans 'Vehicle shortcuts' %}">
        <a href="{% url 'tesla_status' %}">{% trans 'Status' %}</a>
        {% if hashedVin %}
        <a href="{% url 'PersoStats' hashedVin %}">{% trans 'My data' %}</a>
        <a href="{% url 'PersoDayMap' hashedVin %}">{% trans 'Day map' %}</a>
        {% endif %}
        <a href="{% url 'AddTeslaAccount' %}">{% trans 'Tesla account' %}</a>
    </nav>
</div>
