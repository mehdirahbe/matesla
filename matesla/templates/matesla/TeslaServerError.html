{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans 'Tesla server error' %} · MaTesla{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Tesla Fleet API</p>
    <h1>{% trans 'Tesla server error' %}</h1>
    <p class="form-card__intro">{% trans 'Tesla server did return an error' %}</p>
    <div class="button-row">
        <a href="{% url 'tesla_status' %}" class="btn btn-primary">{% trans 'Retry?' %}</a>
        <a href="{% url 'AddTeslaAccount' %}" class="btn btn-secondary">{% trans 'Tesla account' %}</a>
    </div>
</section>
{% endblock %}
