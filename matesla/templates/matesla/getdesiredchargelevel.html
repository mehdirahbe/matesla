{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans 'Battery charge limit (%)' %} — MaTesla{% endblock %}

{% block content %}
<div class="page-heading">
    <p class="eyebrow">{% trans 'Charge' %}</p>
    <h1 class="page-title">{% trans 'Battery charge limit (%)' %}</h1>
</div>
<div class="app-card" style="max-width:28rem;">
    <form action="{% url 'getdesiredchargelevel' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="auth-actions">
            <input type="submit" value="{% trans 'Save' %}" class="btn btn-primary">
            <a href="{% url 'tesla_status' %}" class="btn btn-secondary">{% trans 'Status' %}</a>
        </div>
    </form>
</div>
{% endblock %}
