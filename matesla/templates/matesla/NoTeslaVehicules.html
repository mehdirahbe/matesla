{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans 'No vehicles' %} — MaTesla{% endblock %}

{% block content %}
<div class="app-card" style="max-width:32rem;">
    <h1 class="page-title" style="font-size:1.4rem;">{% trans 'No vehicles are associated to your account. Please retry when your car will be there.' %}</h1>
    <div class="auth-actions mt-3">
        <a href="{% url 'tesla_status' %}" class="btn btn-primary">{% trans 'Retry?' %}</a>
        <a href="{% url 'AddTeslaAccount' %}" class="btn btn-secondary">{% trans 'Tesla account' %}</a>
    </div>
</div>
{% endblock %}
